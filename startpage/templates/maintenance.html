<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Maintenance - BuyerKraze</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-purple-900 via-indigo-900 to-purple-800 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4">
        <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-2xl p-12 text-center">
            <div class="mb-8">
                <i class="fas fa-tools text-purple-600 text-8xl mb-4"></i>
            </div>
            
            <h1 class="text-4xl font-bold text-gray-800 mb-4">Site Under Maintenance</h1>
            
            <div class="bg-purple-50 border-2 border-purple-200 rounded-lg p-6 mb-8">
                <p class="text-lg text-gray-700">{{ message }}</p>
            </div>
            
            <div class="flex justify-center items-center gap-2 text-gray-600">
                <div class="w-3 h-3 bg-purple-600 rounded-full animate-bounce"></div>
                <div class="w-3 h-3 bg-purple-600 rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
                <div class="w-3 h-3 bg-purple-600 rounded-full animate-bounce" style="animation-delay: 0.4s;"></div>
            </div>
            
            <p class="text-sm text-gray-500 mt-6">We'll be back shortly. Thank you for your patience!</p>
        </div>
    </div>
</body>
</html>
